# Config DESCARTAVEL do spike SP0. Removida na Task 7, junto com o servico.
# Ver docs/superpowers/specs/2026-08-28-hospedagem-online-design.md
services:
  - type: web
    name: lfh-spike
    runtime: python
    plan: free
    branch: spike/deploy-render
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    # OBRIGATORIO, e a descoberta do 1o deploy: sem healthCheckPath o Render
    # sonda o servico com HEAD, e a lib websockets RECUSA todo metodo que nao
    # seja GET dentro de http11.py -- antes do nosso process_request ser
    # chamado, entao nao ha como tratar isso no nosso codigo. O servidor fecha
    # a conexao sem responder nada, o Render espera e marca "==> Timed Out".
    # Com healthCheckPath a sonda vira GET, que e o unico metodo que passa.
    healthCheckPath: /index.html
    # LFH_HOSTS fica DE FORA de proposito: o 1o deploy ja PROVOU que o padrao
    # do Linux ("::") funciona neste conteiner -- o servidor aceitou conexoes.
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
