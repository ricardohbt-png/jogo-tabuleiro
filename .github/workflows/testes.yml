name: Testes

# Roda a bateria de tools/test_*.py e tools/test_*.js a cada push e pull request.
# A bateria é dividida em 4 lotes paralelos (matriz) para o tempo total ficar curto.
# O que depende de algo fora do repositório fica em tools/testes_ignorados.txt.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: Testes (lote ${{ matrix.lote }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false        # um lote vermelho não esconde o resultado dos outros
      matrix:
        lote: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Rodar a bateria (lote ${{ matrix.lote }}/4)
        run: python -X utf8 tools/rodar_testes.py --lote ${{ matrix.lote }}/4 -j 2

  sintaxe:
    # Falha rápida (segundos) para erro de sintaxe, antes de esperar a bateria.
    name: Sintaxe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python compila
        run: python -m compileall -q server.py tools
      - name: JavaScript do cliente é válido
        run: |
          node --check game.js
          for f in src/*.js src/lang/*.js src/ui/*.js; do node --check "$f"; done
      - name: JSON dos dados é válido
        run: |
          python - <<'PY'
          import glob, json, sys
          ruins = []
          for p in ["city_shops.json", "monstros_personalizados.json", *glob.glob("dungeons/*.json")]:
              try:
                  json.load(open(p, encoding="utf8"))
              except Exception as e:
                  ruins.append(f"{p}: {e}")
          print("\n".join(ruins) or "JSON ok")
          sys.exit(1 if ruins else 0)
          PY

  navegador:
    # Teste de ponta a ponta: servidor isolado + Chromium (Playwright) percorrendo
    # login, criar jogo, escolher heroi, cidade e masmorra, falhando em qualquer
    # erro de JavaScript no console. Ver tools/e2e/e2e_navegador.py.
    name: Navegador (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências e o Chromium
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Rodar o teste no navegador
        run: python -X utf8 tools/e2e/e2e_navegador.py
