<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de Masmorras — Legends for Hire</title>
<link rel="stylesheet" href="editor.css?v=20260726-tavern-resize">
<!-- Sem Three.js aqui de propósito: a prévia da masmorra roda o cliente do jogo
     num iframe (index.html?preview=1), que carrega o seu próprio Three.js. -->
</head>
<body>
  <header id="topbar">
    <span class="brand">🗺️ Editor</span>
    <span id="tabs">
      <button id="tab-masmorra" class="tab active">Masmorra</button>
      <button id="tab-bestiario" class="tab">Bestiário</button>
      <button id="tab-editor-monstros" class="tab">Editor de criaturas</button>
      <button id="tab-editor-itens" class="tab">Editor de itens</button>
      <button id="tab-cidade" class="tab">Cidade</button>
      <button id="tab-mapa-mundi" class="tab">Mapa do Mundo</button>
      <button id="tab-campanha" class="tab">Campanha</button>
      <button id="tab-cenas" class="tab">Cenas</button>
    </span>
    <span id="dungeon-controls">
      <label>id <input id="m-id" value="nova_masmorra" size="12"></label>
      <label>nome <input id="m-name" value="Nova Masmorra" size="14"></label>
      <label>ambiente
        <select id="m-ambiente">
          <option value="masmorra">Masmorra</option>
          <option value="penumbra">Penumbra (escuro)</option>
          <option value="ar_livre">Ar livre (claro)</option>
        </select>
      </label>
      <label title="Se desmarcado, os heróis não podem deixar a masmorra pela escada de entrada">
        <input type="checkbox" id="m-saida" checked> 🚪 saída pela escada
      </label>
      <label>grid
        <input id="g-w" type="number" min="1" max="60" value="16" style="width:46px">×
        <input id="g-h" type="number" min="1" max="60" value="12" style="width:46px">
      </label>
      <button id="btn-resize">Aplicar grid</button>
      <button id="btn-load">Carregar</button>
      <input id="file-input" type="file" accept="application/json,.json" hidden>
      <button id="btn-save">Salvar</button>
      <button id="btn-preview-3d" title="Visualiza a masmorra atual sem salvar">◈ Visualizar em 3D</button>
    </span>
    <span id="campaign-controls" style="display:none"></span>
  </header>

  <div id="toolbar"></div>
  <main id="workspace">
    <div id="canvas-wrap"><canvas id="board" width="448" height="336"></canvas></div>
    <aside id="panel"><em>Selecione uma ferramenta e desenhe.</em></aside>
  </main>

  <div id="campaign-view" style="display:none"></div>
  <div id="bestiary-view" style="display:none"></div>
  <div id="monster-editor-view" style="display:none"></div>
  <div id="items-editor-view" style="display:none"></div>
  <div id="city-editor-view" style="display:none"></div>
  <div id="world-editor-view" style="display:none"></div>
  <div id="scenes-editor-view" style="display:none"></div>

  <footer id="statusbar"><span id="status"></span></footer>

  <!-- Cache-buster (espelha index.html): evita JS/catálogo do editor servido em cache antigo. -->
  <script>(function(){var v=Date.now();var s=["../src/difficulty.js","editor_items_logic.js","editor_items_custom.js","editor_catalog.js","editor_monsters_custom.js","editor_dungeons.js","editor.js","editor_preview_3d.js","editor_bestiary.js","editor_monster_editor.js","story_upload.js","editor_story.js","editor_campaign.js","editor_items_editor.js","editor_city.js","editor_world.js","editor_scenes.js"];for(var i=0;i<s.length;i++)document.write('<script src="'+s[i]+'?v='+v+'"><\/script>');})();</script>
</body>
</html>
