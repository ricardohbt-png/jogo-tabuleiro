<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Visualizador de Miniaturas 3D</title>
<style>body{margin:0;background:#2a2118;overflow:hidden}</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<script>
const params = new URLSearchParams(location.search);
const modelo = params.get('m') || 'paladin';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2118);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 0.7, 2.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.5, 0);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xfff0d8, 1.0); key.position.set(-2, 3, 2); scene.add(key);
const fill = new THREE.DirectionalLight(0xd0e0ff, 0.45); fill.position.set(2, 1.5, -2); scene.add(fill);

// chão de referência
const chao = new THREE.Mesh(
  new THREE.CircleGeometry(1.2, 48),
  new THREE.MeshStandardMaterial({ color: 0x4a3b2a, roughness: 0.9 })
);
chao.rotation.x = -Math.PI/2;
scene.add(chao);

window.pawn = null;
new THREE.GLTFLoader().load(`assets/models3d/${modelo}.glb?v=${Date.now()}`, g => {
  window.pawn = g.scene;
  scene.add(g.scene);
  window.modeloCarregado = true;
}, undefined, e => { window.erroCarga = String(e); });

// helpers para automação: girar para ângulo e reportar estado
window.girar = (grausY, alturaCam = 0.7, dist = 2.2) => {
  const a = grausY * Math.PI / 180;
  camera.position.set(Math.sin(a) * dist, alturaCam, Math.cos(a) * dist);
  controls.target.set(0, 0.5, 0);
  controls.update();
};

(function loop(){
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
